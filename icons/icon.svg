<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>
  
  <!-- Main Mosque Structure -->
  <g transform="translate(256,320)">
    <!-- Central Dome -->
    <ellipse cx="0" cy="-100" rx="80" ry="35" fill="#d4af37"/>
    <path d="M -80,-100 Q -80,-70 -60,-50 L -60,40 L 60,40 L 60,-50 Q 80,-70 80,-100 Z" fill="#fbbf24"/>
    
    <!-- Dome crescent on top -->
    <circle cx="0" cy="-125" r="12" fill="#fef3c7"/>
    <rect x="-5" y="-115" width="10" height="20" fill="#fef3c7"/>
    
    <!-- Side structures -->
    <rect x="-120" y="-20" width="50" height="60" fill="#fbbf24"/>
    <rect x="70" y="-20" width="50" height="60" fill="#fbbf24"/>
    
    <!-- Left Minaret -->
    <rect x="-150" y="-80" width="20" height="120" fill="#d4af37"/>
    <ellipse cx="-140" cy="-80" rx="15" ry="8" fill="#fbbf24"/>
    <circle cx="-140" cy="-95" r="8" fill="#fef3c7"/>
    <rect x="-143" y="-88" width="6" height="15" fill="#fef3c7"/>
    
    <!-- Right Minaret -->
    <rect x="130" y="-80" width="20" height="120" fill="#d4af37"/>
    <ellipse cx="140" cy="-80" rx="15" ry="8" fill="#fbbf24"/>
    <circle cx="140" cy="-95" r="8" fill="#fef3c7"/>
    <rect x="137" y="-88" width="6" height="15" fill="#fef3c7"/>
    
    <!-- Arched Windows -->
    <path d="M -30,0 L -30,25 L -10,25 L -10,0 Q -20,-10 -30,0 Z" fill="#064e3b" opacity="0.5"/>
    <path d="M 10,0 L 10,25 L 30,25 L 30,0 Q 20,-10 10,0 Z" fill="#064e3b" opacity="0.5"/>
    
    <!-- Door -->
    <rect x="-15" y="10" width="30" height="30" rx="15" ry="5" fill="#064e3b" opacity="0.6"/>
    
    <!-- Base -->
    <rect x="-130" y="40" width="260" height="15" fill="#d4af37"/>
  </g>
</svg>
